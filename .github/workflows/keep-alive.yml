name: Keep Streamlit App Awake

on:
  schedule:
    # Run every 8 hours to reset sleep countdown
    - cron: '0 */8 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
    
    - name: Create keep-alive file
      run: |
        echo "Keep-alive ping: $(date -u)" > keep_alive_timestamp.txt
        echo "This commit resets the Streamlit app sleep timer."
        echo "Next ping in 8 hours." >> keep_alive_timestamp.txt
    
    - name: Commit and push
      run: |
        git add keep_alive_timestamp.txt
        git commit -m "🔄 Keep-alive ping - $(date -u)"
        git push origin main
    
    - name: Log Activity
      run: |
        echo "✅ Keep-alive ping completed at $(date -u)"
        echo "This resets the sleep countdown timer"
        echo "Next ping in 8 hours" 